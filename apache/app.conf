# ================================================================================
# 本番環境用 Apache リバースプロキシ設定
# HTTPでDjangoアプリケーションに全リクエストを転送
# ================================================================================

# HTTPS待受ポート
Listen 443

# HTTP - すべてのホストに対応（IP アドレスでのアクセス可能）
<VirtualHost *:80>
    # ServerName を指定しないことで、あらゆるドメイン・IP でアクセス可能
    # ServerName oc-routenavi.cc.it-hiroshima.ac.jp

    # MIME type を明示的に設定（静的ファイルの正しい type 返却を保証）
    AddType text/css .css
    AddType application/javascript .js
    AddType image/svg+xml .svg

    # フォワードプロキシ機能は無効化（リバースプロキシ用途のみ）
    ProxyRequests Off

    # 静的ファイル（CSS/JS）をApacheから直接配信します
    Alias /static/ /app/staticfiles/
    Alias /media/ /app/media/

    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    <Directory /app/media>
        Require all granted
    </Directory>

    # Django バックエンド（http://app:8000 に転送）
    # ProxyPass の ! は「このパスをプロキシしない」という意味
    # つまり /static/ と /media/ は Apache から直接配信し、それ以外をDjangoに転送
    ProxyPass        /static/ !
    ProxyPass        /media/ !
    # 接続不能時に長時間ハングしないよう接続タイムアウトを短くする
    ProxyPass        / http://app:8000/ connectiontimeout=5 timeout=20 retry=0
    ProxyPassReverse / http://app:8000/

    # バックエンド障害時にApacheのデフォルト画面ではなく明示的なメッセージを返す
    ProxyErrorOverride On
    ErrorDocument 502 "Bad Gateway: Django backend is unavailable. Check django-app-prod and django-db-prod logs."
    ErrorDocument 503 "Service Unavailable: Backend is starting or temporarily down."
    ErrorDocument 504 "Gateway Timeout: Backend did not respond in time."

    # クライアント IP とオリジナルホスト名を保持
    ProxyPreserveHost On
    
    # プロキシ全体の待機時間（過度な待機を避ける）
    ProxyTimeout 20

    # ロギング（httpd公式イメージの標準パス）
    ErrorLog /usr/local/apache2/logs/django_error.log
    CustomLog /usr/local/apache2/logs/django_access.log combined
</VirtualHost>

# ================================================================================
# HTTPS (SSL) VirtualHost
# ================================================================================
<VirtualHost *:443>
    # ServerName は証明書のドメインと一致させる
    ServerName oc-stamp.cc.it-hiroshima.ac.jp

    SSLEngine on
    SSLCertificateFile    /usr/local/apache2/conf/server.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/server.key

    # MIME type を明示的に設定（静的ファイルの正しい type 返却を保証）
    AddType text/css .css
    AddType application/javascript .js
    AddType image/svg+xml .svg

    ProxyRequests Off

    Alias /static/ /app/staticfiles/
    Alias /media/ /app/media/

    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    <Directory /app/media>
        Require all granted
    </Directory>

    ProxyPass        /static/ !
    ProxyPass        /media/ !
    ProxyPass        / http://app:8000/ connectiontimeout=5 timeout=20 retry=0
    ProxyPassReverse / http://app:8000/

    ProxyErrorOverride On
    ErrorDocument 502 "Bad Gateway: Django backend is unavailable. Check django-app-prod and django-db-prod logs."
    ErrorDocument 503 "Service Unavailable: Backend is starting or temporarily down."
    ErrorDocument 504 "Gateway Timeout: Backend did not respond in time."

    ProxyPreserveHost On
    ProxyTimeout 20

    ErrorLog /usr/local/apache2/logs/django_ssl_error.log
    CustomLog /usr/local/apache2/logs/django_ssl_access.log combined
</VirtualHost>

