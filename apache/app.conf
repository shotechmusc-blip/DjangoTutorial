# HTTP → HTTPS リダイレクト
<VirtualHost *:80>
    ServerName oc-routenavi.cc.it-hiroshima.ac.jp
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# HTTPS リバースプロキシ
<VirtualHost *:443>
    ServerName oc-routenavi.cc.it-hiroshima.ac.jp
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/server.crt
    SSLCertificateKeyFile /etc/ssl/private/server.key
docker-compose exec app python manage.py createsuperuser
    # Django バックエンドAPI
    # Docker: http://app:8000 (gunicorn で起動)
    ProxyPass        /api http://app:8000/
    ProxyPassReverse /api http://app:8000/

    # アップロードファイル（メディアファイル）
    ProxyPass        /media http://app:8000/media
    ProxyPassReverse /media http://app:8000/media

    # 静的ファイル（CSS/JS）
    ProxyPass        /static http://app:8000/static
    ProxyPassReverse /static http://app:8000/static

    # パス保持
    ProxyPreserveHost On
    
    # タイムアウト設定（長時間処理対応）
    ProxyTimeout 300

    # ロギング
    ErrorLog ${APACHE_LOG_DIR}/django_error.log
    CustomLog ${APACHE_LOG_DIR}/django_access.log combined
</VirtualHost>

# ローカル開発用（SSL なし）
<VirtualHost *:80>
    ServerName localhost
    
    ProxyPass        / http://app:8000/
    ProxyPassReverse / http://app:8000/
    ProxyPreserveHost On
    ProxyTimeout 300
</VirtualHost>
