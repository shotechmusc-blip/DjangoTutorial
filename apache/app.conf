<VirtualHost *:80>
    ServerName oc-stamp.cc.it-hiroshima.ac.jp
    ServerAlias 150.19.10.214

    RewriteEngine On
    RewriteRule ^ https://oc-stamp.cc.it-hiroshima.ac.jp%{REQUEST_URI} [R=301,L]

    ErrorLog /usr/local/apache2/logs/http_redirect_error.log
    CustomLog /usr/local/apache2/logs/http_redirect_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName oc-stamp.cc.it-hiroshima.ac.jp

    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/server.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/server.key

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 30

    AddType text/css .css
    AddType application/javascript .js
    AddType image/svg+xml .svg

    Alias /static/ /app/staticfiles/
    Alias /media/ /app/media/

    <Directory /app/staticfiles>
        Require all granted
    </Directory>

    <Directory /app/media>
        Require all granted
    </Directory>

    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://app:8000/ connectiontimeout=5 timeout=30 retry=0
    ProxyPassReverse / http://app:8000/

    ProxyErrorOverride On
    ErrorDocument 502 "Bad Gateway: Django backend is unavailable."
    ErrorDocument 503 "Service Unavailable: Backend is starting or temporarily down."
    ErrorDocument 504 "Gateway Timeout: Backend did not respond in time."

    ErrorLog /usr/local/apache2/logs/https_error.log
    CustomLog /usr/local/apache2/logs/https_access.log combined
</VirtualHost>

