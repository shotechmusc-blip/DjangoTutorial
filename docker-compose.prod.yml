services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: stamp-app-prod
    env_file:
      - .env
    environment:
      DEBUG: "False"
      ENABLE_HTTPS: ${ENABLE_HTTPS:-True}
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
      DB_WAIT_SECONDS: ${DB_WAIT_SECONDS:-180}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-3}
    command: ["/app/entrypoint.prod.sh"]
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=5).read(1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: stamp-db-prod
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-stampdb_prod}
      POSTGRES_USER: ${DB_USER:-stampadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace-with-strong-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Keep readiness check aligned with configured DB credentials.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${DB_PORT:-5432} -U ${DB_USER:-stampadmin} -d ${DB_NAME:-stampdb_prod} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      app-network:
        aliases:
          - db
          - django-db-prod
          - stamp-db-prod
    restart: unless-stopped

  reverse_proxy:
    image: httpd:2.4-alpine
    container_name: stamp-apache-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/app.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ${LETSENCRYPT_LIVE_DIR:-/etc/letsencrypt/live/oc-stamp.cc.it-hiroshima.ac.jp}/fullchain.pem:/usr/local/apache2/conf/server.crt:ro
      - ${LETSENCRYPT_LIVE_DIR:-/etc/letsencrypt/live/oc-stamp.cc.it-hiroshima.ac.jp}/privkey.pem:/usr/local/apache2/conf/server.key:ro
    command: >
      sh -c "
      sed -i 's/^#LoadModule mime_module/LoadModule mime_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule proxy_module/LoadModule proxy_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule proxy_http_module/LoadModule proxy_http_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule rewrite_module/LoadModule rewrite_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule ssl_module/LoadModule ssl_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule socache_shmcb_module/LoadModule socache_shmcb_module/' /usr/local/apache2/conf/httpd.conf &&
      grep -q '^Listen 443$' /usr/local/apache2/conf/httpd.conf || echo 'Listen 443' >> /usr/local/apache2/conf/httpd.conf &&
      sed -i 's|^#Include conf/extra/httpd-vhosts.conf|Include conf/extra/httpd-vhosts.conf|' /usr/local/apache2/conf/httpd.conf &&
      httpd-foreground
      "
    depends_on:
      app:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

volumes:
  media_volume:
  static_volume:
  postgres_data:

networks:
  app-network:
    driver: bridge
