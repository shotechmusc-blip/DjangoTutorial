# 本番環境用 docker-compose（環境変数かシークレットで管理）
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-app-prod
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      # PostgreSQL接続設定
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: always

  # 本番データベース（PostgreSQL）
  db:
    image: postgres:16-alpine
    container_name: django-db-prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app-network
    restart: always

  reverse_proxy:
    image: httpd:2.4-alpine
    container_name: apache-proxy-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/app.conf:/usr/local/apache2/conf/vhosts.d/app.conf:ro
      - ./certs/server.crt:/etc/ssl/certs/server.crt:ro
      - ./certs/server.key:/etc/ssl/private/server.key:ro
    depends_on:
      - app
    networks:
      - app-network
    restart: always

volumes:
  media_volume:
  static_volume:
  postgres_data:

networks:
  app-network:
    driver: bridge
