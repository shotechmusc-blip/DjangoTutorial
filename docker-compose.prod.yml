# 本番環境用 docker-compose（環境変数かシークレットで管理）

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-app-prod
    expose:
      - "8000"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - SECRET_KEY=${SECRET_KEY}
      # PostgreSQL接続設定
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_CONNECT_TIMEOUT=${DB_CONNECT_TIMEOUT:-5}
      - DB_WAIT_SECONDS=${DB_WAIT_SECONDS:-180}
      - DB_WAIT_INTERVAL=${DB_WAIT_INTERVAL:-3}
      # HTTP運用中はCOOPヘッダーを無効化（HTTPS移行後はTrueに戻す）
      - ENABLE_HTTPS=${ENABLE_HTTPS:-False}
    command: ["sh", "/app/entrypoint.prod.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    restart: always

  # 本番データベース（PostgreSQL）
  db:
    image: postgres:16-alpine
    container_name: django-db-prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      app-network:
        aliases:
          - db
          - django-db-prod
    restart: always

  reverse_proxy:
    image: httpd:2.4-alpine
    container_name: apache-proxy-prod
    ports:
      # 本番環境では以下のポート設定を使用
      # HTTP: レンタルサーバーのポート（例: 8080, 8888 など）
      - "80:80"
      - "443:443"
    volumes:
      - ./apache/app.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf:ro
      # Django アプリの静的ファイルをApacheから配信
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      # Let's Encrypt 証明書をホストからマウント
      - /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN:-oc-stamp.cc.it-hiroshima.ac.jp}/fullchain.pem:/usr/local/apache2/conf/server.crt:ro
      - /etc/letsencrypt/live/${LETSENCRYPT_DOMAIN:-oc-stamp.cc.it-hiroshima.ac.jp}/privkey.pem:/usr/local/apache2/conf/server.key:ro
    command: >
      sh -c "
      sed -i 's/^#LoadModule mime_module/LoadModule mime_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule proxy_module/LoadModule proxy_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule proxy_http_module/LoadModule proxy_http_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule rewrite_module/LoadModule rewrite_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule ssl_module/LoadModule ssl_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's/^#LoadModule socache_shmcb_module/LoadModule socache_shmcb_module/' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's|^#Include conf/extra/httpd-vhosts.conf|Include conf/extra/httpd-vhosts.conf|' /usr/local/apache2/conf/httpd.conf &&
      sed -i 's|^#Include conf/extra/httpd-mime.conf|Include conf/extra/httpd-mime.conf|' /usr/local/apache2/conf/httpd.conf &&
      httpd-foreground
      "
    depends_on:
      - app
    networks:
      - app-network
    restart: always

volumes:
  media_volume:
  static_volume:
  postgres_data:

networks:
  app-network:
    driver: bridge
